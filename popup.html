<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintIFFar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.98);
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --track: rgba(255, 255, 255, 0.12);
      --fill: linear-gradient(90deg, #38bdf8, #22c55e);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-2: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      min-height: 280px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.12), transparent 42%), var(--bg);
      color: var(--text);
    }
    .wrap {
      padding: 14px;
      min-height: 280px;
    }
    .card {
      height: 100%;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .message {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }
    .bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }
    .fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--fill);
      transition: width 180ms ease;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .status {
      font-weight: 600;
    }
    .hint {
      margin-top: 2px;
      font-size: 12px;
      color: #93c5fd;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="title">PrintIFFar</p>
      <p class="message">Nao troque de aba ate o processo terminar.</p>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="meta">
        <span id="counter" class="status">0 / 0</span>
        <span id="percent">0%</span>
      </div>
      <div id="extra" class="hint">Pronto para iniciar.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
